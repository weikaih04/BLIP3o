version: v2
description: "SAM3_3D + LingBot-Depth freeze21 + all datasets + ITW_final + canonical rotation + dense GT, 4 nodes 32 GPUs, finetuned from dense omni3d 12e ckpt"
budget: ai2/oe-mm
tasks:
- name: sam3-3d-f21-alldata-canonical-dense-ft-4n
  replicas: 4
  image:
    docker: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-devel
  envVars:
    - name: WEIKAI_UW_WANDB_KEY
      secret: WEIKAI_UW_WANDB_KEY
    # NCCL InfiniBand settings for multi-node
    - name: NCCL_SOCKET_IFNAME
      value: ib
    - name: NCCL_IB_HCA
      value: "^=mlx5_bond_0"
    - name: NCCL_DEBUG
      value: INFO
  command: ['bash', '-c']
  arguments:
  - |
    # Experiment settings
    EXP_NAME="sam3_3d_lingbot_f21_alldata_canonical_dense_ft_12e_4node"

    # Set timezone non-interactively
    export DEBIAN_FRONTEND=noninteractive
    export TZ=America/Los_Angeles

    # Memory optimization
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    # NCCL optimization for InfiniBand
    export NCCL_IB_DISABLE=0
    export NCCL_TIMEOUT_MINUTES=60

    # torch.compile disabled
    export SAM3_COMPILE=0

    # bf16 mixed precision
    export MIXED_PRECISION=bf16

    apt-get update && \
    apt-get install -y libstdc++6 libgl1-mesa-glx libglib2.0-0 g++ git \
        libibverbs1 libibverbs-dev librdmacm1 ibverbs-providers && \
    source /weka/oe-training-default/jieyuz2/improve_segments/miniconda3/bin/activate && \
    conda activate opendet3d && \
    cd /weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet && \
    export PYTHONPATH=/weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet:/weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet/UniDepth:/weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet/Depth-Anything-3:/weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet/sam3:/weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet/MoGe2:/weka/oe-training-default/jasonr/3d_box/3d_boundingbox_detection/Foundation3DDet/sam3_da3/Foundation3DDet/lingbot-depth:$PYTHONPATH && \
    export WANDB_API_KEY=$WEIKAI_UW_WANDB_KEY && \
    export WANDB_PROJECT="SAM3_3D-Training" && \
    export WANDB_NAME=$EXP_NAME && \
    export WANDB_TAGS="sam3_3d,lingbot_depth,freeze21,alldata,itw_final,canonical,dense_gt,finetune,4node" && \
    torchrun \
        --nnodes=4 \
        --node-rank=$BEAKER_REPLICA_RANK \
        --nproc-per-node=8 \
        --rdzv_backend=static \
        --rdzv_id=sam3_3d_alldata_dense_ft_4n \
        --rdzv_conf="read_timeout=600" \
        --rdzv_endpoint=$BEAKER_LEADER_REPLICA_HOSTNAME:29401 \
        -m vis4d.engine.run fit \
        --config opendet3d/zoo/sam3_3d/sam3_3d_lingbot_depth_freeze21_omni3d_ca1m_waymo_3eed_fp_itw_canonical.py \
        --gpus 8 \
        --nodes 4 \
        --ckpt vis4d-workspace/sam3_3d_lingbot_f21_omni3d_canonical_dense_12e_4node/v2/checkpoints/epoch=11-step=15996.ckpt \
        --config.use_checkpoint=False \
        --config.params.samples_per_gpu=4 \
        --config.params.workers_per_gpu=8 \
        --config.params.accumulate_grad_batches=1 \
        --config.params.base_lr=4e-4 \
        --config.params.num_epochs=12 \
        --config.params.step_1=8 \
        --config.params.step_2=10 \
        --config.params.freeze_backbone=False \
        --config.params.freeze_all_pretrained=False \
        --config.params.nms=True \
        --config.params.nms_iou_threshold=0.6 \
        --config.params.score_threshold=0.05 \
        --config.experiment_name=$EXP_NAME \
        --config.work_dir=vis4d-workspace \
        --config.version=v1 \
        --config.pl_trainer.val_check_interval=1.0 \
        --config.pl_trainer.strategy=ddp_find_unused_parameters_true \
        --wandb
  result:
    path: /exp_outputs
  datasets:
    - mountPath: /weka/oe-training-default
      source:
        weka: oe-training-default
  resources:
    gpuCount: 8
    sharedMemory: 1000GiB
  context:
    priority: urgent
    preemptible: true
  constraints:
    cluster: [ai2/jupiter, ai2/ceres]
  hostNetworking: true
  leaderSelection: true
