version: v2
description: "molmo3-3d: V3 Stage-1.5 (CFG-AWARE KD): warmstart from v3s1-kd ckpt-1000; kd_v now matches the GUIDED velocity v_u+s(v_c-v_u), s~U[3,7.5] (lite: student null pass no_grad) — fixes the x7.5 amplification sand found @1500. connector-only, I1-only, 1024 tok/view, ema_decay 0.998 (adapted to 2k-step run). docs/V3_DISTILL_DESIGN.md"
budget: ai2/oe-omai
tasks:
- name: molmo3-3d-v3s15-kdcfg-i1-tok1024-8g
  image:
    docker: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  envVars:
    - name: WEIKAI_UW_WANDB_KEY
      secret: WEIKAI_UW_WANDB_KEY
  command: ['bash', '-c']
  arguments:
  - |
    EXP_NAME="molmo3_3d_v3s15_kdcfg_i1_tok1024_8g"

    export DEBIAN_FRONTEND=noninteractive
    export TZ=America/Los_Angeles
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    export ATTN_BACKEND=flash_attn
    export TOKENIZERS_PARALLELISM=false
    export TRITON_CACHE_DIR=/tmp/triton_cache
    export TORCH_EXTENSIONS_DIR=/weka/oe-training-default/jasonr/3d_box/claude_code/.cache/torch_extensions
    export TRITON_LIBCUDA_PATH=/weka/oe-training-default/jasonr/3d_box/miniconda3/envs/blip3o_trellis_qwen35/targets/x86_64-linux/lib/stubs

    apt-get update && \
    apt-get install -y libstdc++6 libgl1-mesa-glx libglib2.0-0 g++ git \
        libibverbs1 libibverbs-dev librdmacm1 ibverbs-providers && \
    source /weka/oe-training-default/jasonr/3d_box/miniconda3/bin/activate && \
    conda activate blip3o_trellis_qwen35 && \
    cd /weka/oe-training-default/jasonr/3d_box/world_explore/trellis2_blip3o && \
    export HF_HOME=/weka/oe-training-default/jasonr/3d_box/claude_code/.cache/huggingface && \
    export WANDB_API_KEY=$WEIKAI_UW_WANDB_KEY && \
    export WANDB_PROJECT="trellis2_blip3o" && \
    export WANDB_NAME=$EXP_NAME && \
    export WANDB_TAGS="molmo3_3d,qwen35_2b,trellis2,512_cascade,ready_v1_80k,i1_only,connector_only,tok1024,v3s15,kdcfg,freeze_vlm,ema" && \
    python -m torch.distributed.run \
        --nnodes=1 \
        --nproc-per-node=8 \
        --master_port=29402 \
        train_native.py \
        --vlm_model Qwen/Qwen3.5-2B \
        --mixture_config configs/mix_i1_only.yaml \
        --build_slat True \
        --ss_only False \
        --freeze_vlm True \
        --flow_tune none \
        --distill_dino True --distill_v_weight 1.0 --distill_f_weight 0.5 --distill_f_blocks auto5 \
        --distill_cfg_lo 3.0 \
        --distill_cfg_hi 7.5 \
        --init_from_checkpoint /weka/oe-training-default/jasonr/3d_box/world_explore/experiment/qwen35_trellis2_training/runs/molmo3_3d_v3s1_kd_i1_tok1024_8g/checkpoint-1000 \
        --target_tokens_per_view 1024 \
        --slat_resolution 512 \
        --cond_fusion none \
        --max_slat_tokens 4096 \
        --elastic_slat True \
        --elastic_target_ratio 0.1 \
        --compile_ss_flow False \
        --output_dir /weka/oe-training-default/jasonr/3d_box/world_explore/experiment/qwen35_trellis2_training/runs/$EXP_NAME \
        --max_steps 2000 \
        --bf16 True \
        --per_device_train_batch_size 2 \
        --gradient_accumulation_steps 16 \
        --learning_rate 1e-4 \
        --warmup_steps 100 \
        --weight_decay 0.01 \
        --adam_beta1 0.9 \
        --adam_beta2 0.95 \
        --max_grad_norm 1.0 \
        --ema_decay 0.998 \
        --logging_steps 5 \
        --save_steps 500 \
        --save_total_limit 4 \
        --report_to wandb \
        --deepspeed configs/deepspeed_zero2.json \
        --ignore_data_skip True \
        --dataloader_num_workers 0
  result:
    path: /results
  datasets:
    - mountPath: /weka/oe-training-default
      source:
        weka: oe-training-default
  resources:
    gpuCount: 8
    sharedMemory: 1000GiB
  context:
    priority: urgent
    preemptible: true
  constraints:
    cluster: [ai2/jupiter, ai2/ceres]
  hostNetworking: true
