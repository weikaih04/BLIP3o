version: v2
description: "molmo3-3d: DUAL-branch (DINOv3 anchor + Qwen cross-attn on LAST 20% blocks only via dual_qwen_last_frac=0.2) ready_v1 80k 3-task 3D, 512 cascade, 2node 16gpu, last15 + max-GC, full 4-view quality + full-throughput deepspeed. last_frac cuts dual +9.5GB→+2GB (smoke 61GB/2GPU). + ROPE BUG FIXED (builder._to_bf16_keep_complex preserves complex64 rope_phases; prev run had bf16-corrupted rope → SS shatter). from pretrained TRELLIS, compile on"
budget: ai2/oe-omai
tasks:
- name: molmo3-3d-dual-ready-v1-80k-512-mix3d-2n
  replicas: 2
  image:
    docker: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  envVars:
    - name: WEIKAI_UW_WANDB_KEY
      secret: WEIKAI_UW_WANDB_KEY
    # NCCL InfiniBand (required for multi-node)
    - name: NCCL_SOCKET_IFNAME
      value: ib
    - name: NCCL_IB_HCA
      value: "^=mlx5_bond_0"
    - name: NCCL_DEBUG
      value: INFO
  command: ['bash', '-c']
  arguments:
  - |
    EXP_NAME="molmo3_3d_dual_ready_v1_80k_512_mix3d_2n_last15_qlast20_ropefix"

    export DEBIAN_FRONTEND=noninteractive
    export TZ=America/Los_Angeles

    # Memory + attention
    export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    export ATTN_BACKEND=flash_attn
    export TOKENIZERS_PARALLELISM=false

    # NCCL — trim per-GPU IB buffer footprint (multi-node ~5.3GB) so dual+512 fits
    export NCCL_IB_DISABLE=0
    export NCCL_TIMEOUT_MINUTES=60

    # Triton cache MUST be node-local (/tmp), not shared weka — ranks racing
    # torch.compile to the same path corrupts the cache.
    export TRITON_CACHE_DIR=/tmp/triton_cache
    export TORCH_EXTENSIONS_DIR=/weka/oe-training-default/jasonr/3d_box/claude_code/.cache/torch_extensions
    export TRITON_LIBCUDA_PATH=/weka/oe-training-default/jasonr/3d_box/miniconda3/envs/blip3o_trellis_qwen35/targets/x86_64-linux/lib/stubs

    apt-get update && \
    apt-get install -y libstdc++6 libgl1-mesa-glx libglib2.0-0 g++ git \
        libibverbs1 libibverbs-dev librdmacm1 ibverbs-providers && \
    source /weka/oe-training-default/jasonr/3d_box/miniconda3/bin/activate && \
    conda activate blip3o_trellis_qwen35 && \
    cd /weka/oe-training-default/jasonr/3d_box/world_explore/trellis2_blip3o && \
    export HF_HOME=/weka/oe-training-default/jasonr/3d_box/claude_code/.cache/huggingface && \
    export WANDB_API_KEY=$WEIKAI_UW_WANDB_KEY && \
    export WANDB_PROJECT="trellis2_blip3o" && \
    export WANDB_NAME=$EXP_NAME && \
    export WANDB_TAGS="molmo3_3d,qwen35_2b,trellis2,512_cascade,ready_v1_80k,mix3d,last15,qlast20,ropefix,freeze_vlm,ema,dual_cond,dinov3_anchor" && \
    python -m torch.distributed.run \
        --nnodes=2 \
        --node-rank=$BEAKER_REPLICA_RANK \
        --nproc-per-node=8 \
        --rdzv_backend=static \
        --rdzv_id=qwen35_trellis2_dual_512_2n_last15_qlast20_ropefix \
        --rdzv_conf="read_timeout=600" \
        --rdzv_endpoint=$BEAKER_LEADER_REPLICA_HOSTNAME:29401 \
        train_native.py \
        --vlm_model Qwen/Qwen3.5-2B \
        --mixture_config configs/mix_3d_only.yaml \
        --build_slat True \
        --ss_only False \
        --freeze_vlm True \
        --flow_tune last15 \
        --dual_qwen_last_frac 0.2 \
        --slat_resolution 512 \
        --cond_fusion none \
        --dual_cond True \
        --dual_cond_max_views 8 \
        --max_slat_tokens 4096 \
        --dual_ss_checkpoint True \
        --elastic_slat True \
        --elastic_target_ratio 0.1 \
        --compile_ss_flow True \
        --compile_mode default \
        --output_dir /weka/oe-training-default/jasonr/3d_box/world_explore/experiment/qwen35_trellis2_training/runs/$EXP_NAME \
        --max_steps 30000 \
        --bf16 True \
        --per_device_train_batch_size 1 \
        --gradient_accumulation_steps 1 \
        --learning_rate 1e-4 \
        --warmup_steps 100 \
        --weight_decay 0.01 \
        --adam_beta1 0.9 \
        --adam_beta2 0.95 \
        --max_grad_norm 1.0 \
        --ema_decay 0.9999 \
        --logging_steps 10 \
        --save_steps 1000 \
        --save_total_limit 4 \
        --report_to wandb \
        --deepspeed configs/deepspeed_zero2.json \
        --ignore_data_skip True \
        --dataloader_num_workers 0
  result:
    path: /results
  datasets:
    - mountPath: /weka/oe-training-default
      source:
        weka: oe-training-default
  resources:
    gpuCount: 8
    sharedMemory: 1000GiB
  context:
    priority: urgent
    preemptible: true
  constraints:
    cluster: [ai2/jupiter, ai2/ceres]
  hostNetworking: true
  leaderSelection: true
